<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单AI智能分类系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .main-content {
      padding: 40px;
    }

    .section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #667eea;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .result-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      border-left: 4px solid #667eea;
      display: none;
    }

    .result-card.show {
      display: block;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-item {
      margin-bottom: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      font-weight: 500;
      color: #555;
      display: inline-block;
      width: 120px;
    }

    .result-value {
      color: #333;
    }

    .confidence-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .confidence-high {
      background: #4caf50;
      color: white;
    }

    .confidence-medium {
      background: #ff9800;
      color: white;
    }

    .confidence-low {
      background: #f44336;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 20px;
      display: none;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }

    .tab {
      padding: 12px 24px;
      background: none;
      border: none;
      color: #666;
      font-size: 1rem;
      cursor: pointer;
      position: relative;
      transition: color 0.3s;
    }

    .tab.active {
      color: #667eea;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .batch-result {
      max-height: 400px;
      overflow-y: auto;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
    }

    .batch-item {
      background: white;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 10px;
      border-left: 3px solid #667eea;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .stat-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body class="classification-page">
<div class="container">
  <!-- 返回按钮 -->
  <div style="padding: 15px 20px 0;">
    <button class="btn btn-secondary" onclick="goBackToChat()">← 返回AI对话</button>
  </div>

  <div class="header">
    <h1>工单AI智能分类系统</h1>
    <p>基于AI和规则引擎的智能工单自动分类解决方案</p>
  </div>

  <div class="main-content">
    <!-- Tab导航 -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('single')">单个分类</button>
      <button class="tab" onclick="switchTab('batch')">批量分类</button>
      <button class="tab" onclick="switchTab('quick')">快速分类</button>
      <button class="tab" onclick="switchTab('query')">查询结果</button>
      <button class="tab" onclick="switchTab('stats')">统计信息</button>
    </div>

    <!-- 单个分类 -->
    <div id="single-tab" class="tab-content active">
      <div class="section">
        <h2 class="section-title">工单内容分类</h2>

        <div class="form-group">
          <label for="orderId">工单ID（可选）</label>
          <input type="number" id="orderId" placeholder="输入工单ID查询已有工单">
        </div>

        <div class="form-group">
          <label for="orderContent">工单内容</label>
          <textarea id="orderContent" placeholder="请输入工单内容，例如：小区门口有很多垃圾堆积，影响环境..."></textarea>
        </div>

        <button class="btn btn-primary" onclick="classify()">开始分类</button>
        <button class="btn btn-secondary" onclick="clearForm()">清空</button>
        <button class="btn btn-secondary" onclick="loadSample()">加载示例</button>
      </div>

      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px;">AI正在分析中...</p>
      </div>

      <div id="result" class="result-card">
        <h3 style="margin-bottom: 15px; color: #667eea;">🏷️ AI分类预览结果</h3>
        <div class="result-item">
          <span class="result-label">分类ID：</span>
          <span id="resultCategoryId" class="result-value"></span>
        </div>
        <div class="result-item">
          <span class="result-label">分类名称：</span>
          <span id="resultCategoryName" class="result-value"></span>
        </div>
        <div class="result-item">
          <span class="result-label">分类代码：</span>
          <span id="resultCategoryCode" class="result-value"></span>
        </div>
        <div class="result-item">
          <span class="result-label">匹配类型：</span>
          <span id="resultMatchType" class="result-value"></span>
        </div>
        <div class="result-item">
          <span class="result-label">置信度：</span>
          <span id="resultConfidence" class="result-value"></span>
        </div>
        <div class="result-item">
          <span class="result-label">匹配证据：</span>
          <span id="resultEvidence" class="result-value"></span>
        </div>
        <div class="result-item">
          <span class="result-label">AI推理：</span>
          <span id="resultAiReasoning" class="result-value"></span>
        </div>
        <!-- 确认操作区 -->
        <div id="confirmActions" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #d4e8fc;">
          <button class="btn btn-primary" id="confirmBtn" onclick="confirmClassification()">✓ 确认分类</button>
          <button class="btn btn-secondary" onclick="cancelClassification()">重新分类</button>
        </div>
        <!-- 确认结果提示 -->
        <div id="confirmResult" style="display: none; margin-top: 15px; padding: 10px; background: #f0fff4; border-radius: 6px; text-align: center; color: #52c41a; font-weight: 500;">
          ✓ 已成功保存到数据库
        </div>
      </div>
    </div>

    <!-- 批量分类 -->
    <div id="batch-tab" class="tab-content">
      <div class="section">
        <h2 class="section-title">批量工单分类</h2>

        <div class="form-group">
          <label for="batchOrderIds">工单ID列表</label>
          <textarea id="batchOrderIds" placeholder="输入工单ID，多个ID用逗号分隔，例如：1,2,3,4,5"></textarea>
        </div>

        <button class="btn btn-primary" onclick="batchClassify()">批量分类</button>
        <button class="btn btn-secondary" onclick="clearBatchForm()">清空</button>
      </div>

      <div id="batchLoading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px;">批量处理中，请稍候...</p>
      </div>

      <div id="batchResult" class="batch-result" style="display: none;">
        <h3 style="margin-bottom: 15px;">批量分类结果</h3>
        <div id="batchResultList"></div>
      </div>
    </div>

    <!-- 查询结果 -->
    <div id="query-tab" class="tab-content">
      <div class="section">
        <h2 class="section-title">查询工单分类结果</h2>

        <div class="form-group">
          <label for="queryOrderId">工单ID</label>
          <input type="number" id="queryOrderId" placeholder="输入要查询的工单ID">
        </div>

        <button class="btn btn-primary" onclick="queryResult()">查询</button>
      </div>

      <div id="queryResult" class="result-card">
        <!-- 查询结果将显示在这里 -->
      </div>
    </div>

    <!-- 快速分类 -->
    <div id="quick-tab" class="tab-content">
      <div class="section">
        <h2 class="section-title">快速工单分类</h2>

        <div class="form-group">
          <label for="unclassifiedOrderSelect">选择未分类工单</label>
          <select id="unclassifiedOrderSelect" class="form-control" onchange="loadSelectedOrder()">
            <option value="">-- 请选择未分类工单 --</option>
          </select>
        </div>

        <div class="form-group">
          <label>工单内容</label>
          <textarea id="quickOrderContent" class="form-control" readonly placeholder="选择工单后显示内容"></textarea>
        </div>

        <div class="form-group">
          <label for="quickCategorySelect">选择分类（含未分类选项）</label>
          <select id="quickCategorySelect" class="form-control">
            <option value="0">─ 不分类 ─</option>
          </select>
        </div>

        <button class="btn btn-primary" onclick="quickConfirmClassification()">✓ 确认分类</button>
        <button class="btn btn-secondary" onclick="clearQuickForm()">清空</button>
        <p style="margin-top: 10px; color: #666; font-size: 0.9rem;">
          <small>提示：选择"不分类"可跳过此工单的自动分类</small>
        </p>
      </div>

      <div id="quickLoading" class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px;">加载中...</p>
      </div>

      <div id="quickResult" class="result-card" style="display: none;">
        <h3 style="margin-bottom: 15px; color: #667eea;">分类结果</h3>
        <div id="quickResultContent"></div>
      </div>
    </div>

    <!-- 统计信息 -->
    <div id="stats-tab" class="tab-content">
      <div class="section">
        <h2 class="section-title">系统统计信息</h2>

        <button class="btn btn-primary" onclick="loadStats()">刷新统计</button>

        <div class="stats-grid">
          <div class="stat-card">
            <div id="totalOrders" class="stat-number">-</div>
            <div class="stat-label">总工单数</div>
          </div>
          <div class="stat-card">
            <div id="classifiedOrders" class="stat-number">-</div>
            <div class="stat-label">已分类工单</div>
          </div>
          <div class="stat-card">
            <div id="unclassifiedOrders" class="stat-number">-</div>
            <div class="stat-label">未分类工单</div>
          </div>
          <div class="stat-card">
            <div id="totalCategories" class="stat-number">-</div>
            <div class="stat-label">分类规则数</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = '/api';
// 当前预览的分类结果
let currentPreview = null;

/**
 * 返回AI对话页面
 */
function goBackToChat() {
    window.location.href = 'index.html';
}

/**
 * 加载未分类工单
 */
async function loadUnclassifiedOrders(showLoadingIndicator = true) {
    if (showLoadingIndicator) {
        showLoading('quickLoading');
    }
    try {
        const response = await fetch(API_BASE + '/classify/unclassified');
        const data = await response.json();

        if (data.code === 200) {
            const select = document.getElementById('unclassifiedOrderSelect');
            select.innerHTML = '<option value="">-- 请选择未分类工单 --</option>';

            data.data.forEach(order => {
                const option = document.createElement('option');
                option.value = order.orderId;
                option.textContent = `工单#${order.orderId}: ${order.orderContent.substring(0, 30)}...`;
                select.appendChild(option);
            });
        } else {
            console.warn('加载未分类工单失败：' + data.message);
        }
    } catch (error) {
        console.error('网络错误：' + error.message);
    } finally {
        if (showLoadingIndicator) {
            hideLoading('quickLoading');
        }
    }
}

/**
 * 加载所有分类
 */
async function loadAllCategories() {
    try {
        const response = await fetch(API_BASE + '/classify/categories');
        const data = await response.json();

        if (data.code === 200) {
            // 保留"不分类"选项
            const select = document.getElementById('quickCategorySelect');
            select.innerHTML = '<option value="0">─ 不分类 ─</option>';

            data.data.forEach(category => {
                const option = document.createElement('option');
                option.value = category.categoryId;
                option.textContent = `${category.categoryName} (${category.categoryCode})`;
                select.appendChild(option);
            });
        } else {
            alert('加载分类失败：' + data.message);
        }
    } catch (error) {
        alert('网络错误：' + error.message);
    }
}

/**
 * 加载选中的工单内容
 */
function loadSelectedOrder() {
    const orderId = document.getElementById('unclassifiedOrderSelect').value;
    if (!orderId) {
        document.getElementById('quickOrderContent').value = '';
        return;
    }

    // 这里需要从已加载的未分类工单中找到对应的内容
    // 为了简化，我们可以重新查询这个工单的详情
    fetch(API_BASE + '/classify/order/' + orderId)
        .then(response => response.json())
        .then(data => {
            if (data.code === 200) {
                document.getElementById('quickOrderContent').value = data.data.orderContent || '';
            }
        })
        .catch(error => {
            console.error('加载工单详情失败', error);
        });
}

/**
 * 快速确认分类
 */
async function quickConfirmClassification() {
    const orderId = document.getElementById('unclassifiedOrderSelect').value;
    const categoryId = document.getElementById('quickCategorySelect').value;

    if (!orderId) {
        alert('请选择工单');
        return;
    }

    showLoading('quickLoading');

    try {
        const response = await fetch(API_BASE + '/classify/confirm', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                orderId: orderId,
                categoryId: categoryId
            })
        });

        const data = await response.json();

        if (data.code === 200) {
            // 显示成功结果
            document.getElementById('quickResultContent').innerHTML = `
                <div class="result-item">
                    <span class="result-label">工单ID：</span>
                    <span class="result-value">${data.data.orderId}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">分类名称：</span>
                    <span class="result-value">${data.data.aiCandidateCategory}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">状态：</span>
                    <span class="result-value status-confirmed">已处理</span>
                </div>
            `;
            document.getElementById('quickResult').style.display = 'block';

            // 重新加载未分类工单列表
            loadUnclassifiedOrders(false);
        } else {
            alert('分类失败：' + data.message);
        }
    } catch (error) {
        alert('网络错误：' + error.message);
    } finally {
        hideLoading('quickLoading');
    }
}

/**
 * 清空快速分类表单
 */
function clearQuickForm() {
    document.getElementById('unclassifiedOrderSelect').value = '';
    document.getElementById('quickOrderContent').value = '';
    document.getElementById('quickCategorySelect').value = '0';
    document.getElementById('quickResult').style.display = 'none';
}

// 切换Tab
function switchTab(tabName) {
  // 隐藏所有tab内容
  document.querySelectorAll('.tab-content').forEach(content => {
    content.classList.remove('active');
  });

  // 移除所有tab的active类
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });

  // 显示选中的tab
  document.getElementById(tabName + '-tab').classList.add('active');
  event.target.classList.add('active');
}

// 单个分类（预览模式）
async function classify() {
  const orderId = document.getElementById('orderId').value;
  const orderContent = document.getElementById('orderContent').value;

  if (!orderId && !orderContent) {
    alert('请输入工单ID或工单内容');
    return;
  }

  const requestData = {};
  if (orderId) requestData.orderId = orderId;
  if (orderContent) requestData.orderContent = orderContent;

  showLoading('loading');
  hideConfirmResult();

  try {
    // 使用预览接口，不直接保存
    const response = await fetch(API_BASE + '/classify/preview', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(requestData)
    });

    const data = await response.json();

    if (data.code === 200) {
      currentPreview = data.data;
      currentPreview.orderId = orderId || null;
      displayPreviewResult(data.data);
    } else {
      alert('分类失败：' + data.message);
    }
  } catch (error) {
    alert('请求失败：' + error.message);
  } finally {
    hideLoading('loading');
  }
}

// 显示预览结果
function displayPreviewResult(result) {
  document.getElementById('resultCategoryId').textContent = result.categoryId || '-';
  document.getElementById('resultCategoryName').textContent = result.categoryName || '-';
  document.getElementById('resultCategoryCode').textContent = result.categoryCode || '-';
  document.getElementById('resultMatchType').textContent = result.matchType || '-';

  // 置信度显示
  const confidenceEl = document.getElementById('resultConfidence');
  const confidence = result.confidence || 0;
  confidenceEl.textContent = confidence.toFixed(2);
  confidenceEl.className = 'result-value';
  if (confidence >= 4.0) {
    confidenceEl.innerHTML += ' <span class="confidence-badge confidence-high">高</span>';
  } else if (confidence >= 2.5) {
    confidenceEl.innerHTML += ' <span class="confidence-badge confidence-medium">中</span>';
  } else {
    confidenceEl.innerHTML += ' <span class="confidence-badge confidence-low">低</span>';
  }

  document.getElementById('resultEvidence').textContent = result.matchEvidence || '-';
  document.getElementById('resultAiReasoning').textContent = result.aiReasoning || '-';

  // 显示确认操作区
  document.getElementById('confirmActions').style.display = 'block';
  document.getElementById('result').classList.add('show');
}

// 确认分类
async function confirmClassification() {
  if (!currentPreview || !currentPreview.categoryId) {
    alert('请先进行分类');
    return;
  }

  try {
    const response = await fetch(API_BASE + '/classify/confirm', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        orderId: currentPreview.orderId,
        categoryId: currentPreview.categoryId
      })
    });

    const data = await response.json();

    if (data.code === 200) {
      // 显示确认成功
      showConfirmResult();
      // 更新当前预览为已保存状态
      currentPreview.saved = true;
    } else {
      alert('确认失败：' + data.message);
    }
  } catch (error) {
    alert('网络错误：' + error.message);
  }
}

// 取消/重新分类
function cancelClassification() {
  // 重置预览状态
  currentPreview = null;
  document.getElementById('confirmActions').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  document.getElementById('orderContent').focus();
}

// 显示确认结果
function showConfirmResult() {
  document.getElementById('confirmActions').style.display = 'none';
  document.getElementById('confirmResult').style.display = 'block';
}

// 隐藏确认结果
function hideConfirmResult() {
  document.getElementById('confirmActions').style.display = 'block';
  document.getElementById('confirmResult').style.display = 'none';
}

// 批量分类
async function batchClassify() {
  const orderIdsText = document.getElementById('batchOrderIds').value;

  if (!orderIdsText) {
    alert('请输入工单ID列表');
    return;
  }

  const orderIds = orderIdsText.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id));

  if (orderIds.length === 0) {
    alert('请输入有效的工单ID');
    return;
  }

  showLoading('batchLoading');

  try {
    const response = await fetch(API_BASE + '/classify/batch', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ orderIds })
    });

    const data = await response.json();

    if (data.code === 200) {
      displayBatchResult(data.data);
    } else {
      alert('批量分类失败：' + data.message);
    }
  } catch (error) {
    alert('请求失败：' + error.message);
  } finally {
    hideLoading('batchLoading');
  }
}

// 显示批量分类结果
function displayBatchResult(results) {
  const resultListEl = document.getElementById('batchResultList');
  resultListEl.innerHTML = '';

  results.forEach(result => {
    const item = document.createElement('div');
    item.className = 'batch-item';

    const confidence = result.confidence || 0;
    const confidenceClass = confidence >= 4.0 ? 'confidence-high' :
                           confidence >= 2.5 ? 'confidence-medium' : 'confidence-low';

    item.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <strong>工单ID: ${result.orderId}</strong>
        <span class="confidence-badge ${confidenceClass}">置信度: ${confidence.toFixed(2)}</span>
      </div>
      <div style="margin-top: 8px;">
        <strong>分类：</strong>${result.categoryName || '未分类'} (${result.categoryCode || '-'})
      </div>
      <div style="margin-top: 4px; color: #666; font-size: 0.9rem;">
        <strong>匹配类型：</strong>${result.matchType || '-'}
      </div>
      <div style="margin-top: 4px; color: #666; font-size: 0.9rem;">
        <strong>证据：</strong>${result.matchEvidence || '-'}
      </div>
    `;

    resultListEl.appendChild(item);
  });

  document.getElementById('batchResult').style.display = 'block';
}

// 查询结果
async function queryResult() {
  const orderId = document.getElementById('queryOrderId').value;

  if (!orderId) {
    alert('请输入工单ID');
    return;
  }

  showLoading('loading');

  try {
    const response = await fetch(API_BASE + '/classify/order/' + orderId);
    const data = await response.json();

    hideLoading('loading');

    if (data.code === 200) {
      displayOrderDetail(data.data);
    } else if (data.code === 404) {
      alert('工单不存在：' + orderId);
    } else {
      alert('查询失败：' + data.message);
    }
  } catch (error) {
    hideLoading('loading');
    alert('请求失败：' + error.message);
  }
}

// 加载统计信息
async function loadStats() {
  try {
    const response = await fetch(API_BASE + '/classify/stats/data');
    const data = await response.json();

    if (data.code === 200) {
      document.getElementById('totalOrders').textContent = data.data.totalOrders;
      document.getElementById('classifiedOrders').textContent = data.data.classifiedOrders;
      // 计算未分类工单
      document.getElementById('unclassifiedOrders').textContent = data.data.totalOrders - data.data.classifiedOrders;
      document.getElementById('totalCategories').textContent = data.data.totalCategories;
    } else {
      console.error('加载统计信息失败：', data.message);
    }
  } catch (error) {
    console.error('加载统计信息失败', error);
  }
}

// 清空表单
function clearForm() {
  document.getElementById('orderId').value = '';
  document.getElementById('orderContent').value = '';
  document.getElementById('result').classList.remove('show');
}

function clearBatchForm() {
  document.getElementById('batchOrderIds').value = '';
  document.getElementById('batchResult').style.display = 'none';
}

// 显示/隐藏加载状态
function showLoading(loadingId) {
  document.getElementById(loadingId).classList.add('show');
}

function hideLoading(loadingId) {
  document.getElementById(loadingId).classList.remove('show');
}

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
  // 加载未分类工单列表和分类列表到快速分类 Tab（不显示 loading）
  loadUnclassifiedOrders(false);
  loadAllCategories();

  // 每 30 秒刷新一次未分类工单列表，确保数据实时性
  setInterval(function() {
    loadUnclassifiedOrders(false);
  }, 30000);
});
</script>
